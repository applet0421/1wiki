services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onewiki}
      POSTGRES_USER: ${POSTGRES_USER:-onewiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  migrate:
    build: .
    restart: "no"
    env_file: .env.production
    environment:
      NODE_ENV: production
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://onewiki:${POSTGRES_PASSWORD}@postgres:5432/onewiki}
      DIRECT_URL: ${DIRECT_URL:-postgresql://onewiki:${POSTGRES_PASSWORD}@postgres:5432/onewiki}
    command: ["npm", "run", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - next_cache:/app/.next/cache
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://onewiki:${POSTGRES_PASSWORD}@postgres:5432/onewiki}
      DIRECT_URL: ${DIRECT_URL:-postgresql://onewiki:${POSTGRES_PASSWORD}@postgres:5432/onewiki}
    command: ["npm", "run", "worker:images"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  next_cache:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
